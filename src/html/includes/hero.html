{% if heroSlides | length %}
<section class="hero" aria-label="Коллекции DESISAN" data-hero>
  <div class="hero__track" data-hero-track>
    {% for slide in heroSlides %}
    <div class="hero__slide">
      <img class="hero__image" src="{{ slide.image }}" alt="" width="2400" height="1600" {% if loop.first %}fetchpriority="high"{% else %}loading="lazy"{% endif %}>
      <div class="container hero__content">
        <p class="eyebrow">{{ slide.eyebrow }}</p>
        {% if loop.first %}<h1 class="hero__title">{% else %}<h2 class="hero__title">{% endif %}
          {{ slide.title }}<br>{{ slide.subtitle }}
        {% if loop.first %}</h1>{% else %}</h2>{% endif %}
        <a class="text-link" href="{{ slide.url }}">Смотреть каталог</a>
      </div>
    </div>
    {% endfor %}
  </div>
  {% if heroSlides | length > 1 %}
  <div class="container hero__controls">
    <button type="button" data-hero-prev aria-label="Предыдущий баннер">←</button>
    <button type="button" data-hero-next aria-label="Следующий баннер">→</button>
  </div>
  {% endif %}
</section>
{% endif %}
