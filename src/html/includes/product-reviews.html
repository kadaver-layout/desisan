<section class="product-reviews" aria-labelledby="reviews-title">
  <div class="container"><div class="product-reviews__inner">
    <h2 class="product-section-title" id="reviews-title">Отзывы покупателей</h2>
    {% if productDetail.reviews | length and productDetail.rating %}<p>{{ productDetail.rating }}</p>{% endif %}
    <div class="product-reviews__list">
      {% for review in productDetail.reviews %}
      <article class="product-review"><p class="product-review__author">{{ review.author }} · {{ review.date }}</p><p class="product-review__rating">{{ review.rating }}</p><p>{{ review.text }}</p></article>
      {% else %}<p>Отзывов пока нет</p>{% endfor %}
    </div>
    <button class="button button--secondary product-reviews__button" type="button" data-open-dialog="product-review" aria-controls="product-review" aria-expanded="false">Написать отзыв</button>
  </div></div>
</section>
